[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis: AI companion TUI with subconscious evolution and custom skills"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core>=1.8.0",
    "agent-framework-openai>=1.8.0",
    "agent-framework-orchestrations>=1.0.0b260210",
    "mcp>=1.24.0,<2",
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.0",
    "typer>=0.9.0",
    "openai>=1.12.0",
    "aiosqlite>=0.19.0",
    "gitpython>=3.1.41",
    "python-dotenv>=1.0.0",
    "ddgs>=9.14.4",
    "tavily-python>=0.7.26",
    "firecrawl-py>=4.28.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "nvidia-riva-client>=2.19.0",
    "numpy",
    "nltk",
    "scikit-learn>=1.4.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.uv]
prerelease = "allow"

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
